[project]
name = "civ6-ai"
version = "0.0.0"
description = "Low-cost LLM opponents for Civilization VI."
readme = "README.md"
license = "LicenseRef-All-Rights-Reserved"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "civ6-mcp",
    # civ6-mcp closes game crash dialogs with this, and skips that silently if it's missing.
    "pywin32>=311; sys_platform == 'win32'",
    # Screenshots of the game window for triage (src/civ6_ai/screenshots.py).
    "pillow>=10; sys_platform == 'win32'",
]

[tool.uv.sources]
civ6-mcp = { git = "https://github.com/lmwilki/civ6-mcp", rev = "dd2019056371b92ea4854e879ddf05a8cad95e8a" }

[tool.uv]
# Used by civ6-mcp's server only, which this project never runs. See docs/decisions.md.
# Remove the anthropic line when this project first depends on it.
override-dependencies = [
    "anthropic; sys_platform == 'never'",
    "fastapi; sys_platform == 'never'",
    "mcp; sys_platform == 'never'",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pyarrow>=26.0.1",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/civ6_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
