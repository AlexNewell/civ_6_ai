repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: check-public-ready
        name: check public-ready rules
        entry: python scripts/check_public_ready.py
        language: system
        pass_filenames: false
        always_run: true
